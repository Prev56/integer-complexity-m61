name: verify
on:
  push: {branches: [main]}
  pull_request:
jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # A submission may not edit the machinery that judges it. This runs FIRST,
      # before `docker build` — which executes arbitrary commands as root at build
      # time — and before run-checker.sh, which configures the very isolation it is
      # supposed to provide.
      #
      # Caveat, stated because it matters: on `pull_request` the workflow itself
      # comes from the pull request, so a PR that edits `.github/` can disable this
      # step. The enforcement for that is requiring approval before fork workflows
      # run at all; this guard raises the bar for everything else.
      - name: A submission must not touch the judging machinery
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -Eq "^(\.github/|Dockerfile$|run-checker\.sh$|task\.json$|preflight\.sh$)"; then
            echo "::error::this pull request modifies the build or the checker harness"
            exit 1
          fi
      - name: Build the sandbox image
        run: docker build -t checker .

      # The checker must accept nothing it should reject. Each example below is
      # a distinct way to be wrong, and each must be caught with its own exit
      # code: 1 for "valid but not winning", 2 for "not a valid submission".
      - name: Valid but not winning must exit 1
        run: |
          ./run-checker.sh examples/valid-not-winning.json && { echo "accepted a non-winning submission"; exit 1; }
          [ $? -eq 1 ] || { echo "wrong exit code for a valid non-winning submission"; exit 1; }
      - name: Every malformed example must be rejected
        run: |
          for f in examples/invalid-*.json; do
            if ./run-checker.sh "$f"; then echo "checker ACCEPTED $f"; exit 1; fi
            echo "correctly rejected $f"
          done

      # The accept path needs proving too: a checker that can only ever reject
      # would pass every test above and be useless.
      - name: The accept path must actually accept
        run: python3 tests/test_accept.py
